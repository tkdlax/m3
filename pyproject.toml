[project]
name = "dividend-agent"
version = "0.1.0"
description = "Paper-only dividend income + covered-call autonomous agent (Alpaca)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "tkdlax" }]
keywords = ["alpaca", "paper-trading", "covered-call", "dividend"]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
dividend-agent = "dividend_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dividend_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/dividend_agent" = "dividend_agent"

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dividend_agent"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
