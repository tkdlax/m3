# Paper-only dry-run deployment (PROJECT_SPEC §16).
# Copy .env.example → .env and supply strategy.yaml before paper_auto.
# No live trading path. Do not place live Alpaca credentials on the host for v1.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: dividend-agent:${IMAGE_TAG:-0.1.0}
    container_name: dividend-agent
    restart: unless-stopped
    user: "10001:10001"
    init: true
    stop_grace_period: 30s
    # Paper secrets (ALPACA_PAPER_*, SEC_USER_AGENT) come only from env_file.
    # Do not re-list them under environment: — empty ${VAR:-} interpolation
    # injects "" and overrides env_file (Compose precedence).
    environment:
      TZ: ${TZ:-America/Denver}
      TRADING_PAUSED: ${TRADING_PAUSED:-true}
      CONFIG_PATH: /config/strategy.yaml
      DB_PATH: /data/agent.sqlite3
      REPORTS_DIR: /reports
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-3600}
      # monthly included for autonomous dry-run cycle (paper_auto still gated).
      SCHEDULER_JOBS: ${SCHEDULER_JOBS:-startup,trading_day,monthly}
      # Set true only after paper credentials are configured and verified.
      REQUIRE_PAPER_ON_START: ${REQUIRE_PAPER_ON_START:-false}
    env_file:
      - .env
    volumes:
      - agent-data:/data
      - agent-reports:/reports
      - agent-logs:/logs
      - ./config/strategy.example.yaml:/config/strategy.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    # No inbound ports for MVP (approvals via authenticated CLI only).
    healthcheck:
      test: ["CMD", "dividend-agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  agent-data:
  agent-reports:
  agent-logs:
