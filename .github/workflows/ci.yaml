name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint-type-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src/dividend_agent

      - name: Pytest
        run: uv run pytest

      - name: Smoke CLI
        run: bash scripts/smoke_test.sh

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env for compose env_file
        run: cp .env.example .env

      - name: Compose config
        run: docker compose -f compose.yaml config >/dev/null

      - name: Build image
        run: docker compose -f compose.yaml build

      - name: TrueNAS override config
        run: docker compose -f compose.yaml -f compose.truenas.yaml config >/dev/null
