# Optional TrueNAS SCALE override — bind-mount host datasets (docs/TRUENAS_DEPLOYMENT.md).
# Usage:
#   docker compose -f compose.yaml -f compose.truenas.yaml --env-file .env up -d --build
#
# Dataset directories must be writable by UID/GID 10001 (image user `agent`).
# Do not use TrueNAS CORE Docker plugins — this path is SCALE Apps / Compose only.
services:
  agent:
    volumes:
      - type: bind
        source: ${TRUENAS_DATA_PATH:-/mnt/tank/apps/dividend-agent/data}
        target: /data
      - type: bind
        source: ${TRUENAS_REPORTS_PATH:-/mnt/tank/apps/dividend-agent/reports}
        target: /reports
      - type: bind
        source: ${TRUENAS_LOGS_PATH:-/mnt/tank/apps/dividend-agent/logs}
        target: /logs
      - type: bind
        source: ${TRUENAS_CONFIG_PATH:-/mnt/tank/apps/dividend-agent/config/strategy.yaml}
        target: /config/strategy.yaml
        read_only: true
